<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>NiviTrack isolated segmenter</title>
  </head>
  <body>
    <script>
      const channel = 'nivitrack-instance-segmenter-v1';
      const report = (reason) => {
        const message = reason instanceof Error ? reason.message : String(reason || '未知錯誤');
        parent.postMessage({ channel, requestId: 0, type: 'bootstrap-error', message }, location.origin);
      };
      addEventListener('error', (event) => report(event.error || event.message));
      addEventListener('unhandledrejection', (event) => report(event.reason));
    </script>
    <script type="module" src="./interactive-segmenter-frame.js?v=1"></script>
  </body>
</html>
